buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:6.0.+'
        classpath 'org.spongepowered:mixingradle:0.7.38'
    }
}

plugins {
    id 'java'
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'mclink.refmap.json'
    config 'mclink.mixins.json'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

version = '0.3.0'
group = 'com.tailscale.tailcat.minecraft'

base {
    archivesName = 'tailcat-for-minecraft-forge-1.21.11'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

minecraft {
    mappings channel: 'official', version: '1.21.11'

    runs {
        client {
            workingDirectory project.file('run')
            args '--mixin.config=mclink.mixins.json'
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mclink {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.11-61.2.1'
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    compileOnly 'net.minecraftforge:eventbus:7.0.5'
    compileOnly 'net.minecraftforge:javafmllanguage:1.21.11-61.2.1'
}

sourceSets {
    main {
        java {
            srcDir file('../mod-common/src/main/java')
        }
        resources {
            srcDir file('../mod-common/src/main/resources')
        }
    }
}

processResources {
    filesMatching('tailcat-build.properties') { expand version: project.version }
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes([
            'MixinConfigs'            : 'mclink.mixins.json',
            'Specification-Title'     : 'mclink',
            'Specification-Vendor'    : 'Tailscale',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Tailscale',
        ])
    }
}

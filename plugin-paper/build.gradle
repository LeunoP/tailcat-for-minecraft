plugins {
    id 'java'
}

group = 'com.tailscale.tailcat.minecraft'
version = '0.3.1'
base {
    archivesName = 'tailcat-for-minecraft-paper-plugin'
}

sourceSets.main.java.srcDir file('../mod-common/src/main/java')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'com.google.code.gson:gson:2.10.1'
}

processResources {
    filesMatching('tailcat-build.properties') { expand version: project.version }
    from('../mod-common/src/main/resources/tailcat-build.properties')
    from('../mod-common/src/main/resources/META-INF/licenses') { into 'META-INF/licenses' }
    from('../mod-common/src/main/resources/assets/mclink/lang') { into 'assets/mclink/lang' }
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Tailcat Paper Plugin',
            'Implementation-Version': project.version
        )
    }
}

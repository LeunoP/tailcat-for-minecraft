plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = 'tailcat-for-minecraft-neoforge-26.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neo_version
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

sourceSets {
    main {
        java {
            srcDir file('../mod-common/src/main/java')
        }
        resources {
            srcDir file('../mod-common/src/main/resources')
        }
    }
}

processResources {
    filesMatching('tailcat-build.properties') { expand version: project.version }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ["-AoutRefMapFile=${layout.buildDirectory.file('classes/java/main/mclink.refmap.json').get().asFile}"]
}

jar {
    manifest.attributes(['MixinConfigs': 'mclink.mixins.json'])
}

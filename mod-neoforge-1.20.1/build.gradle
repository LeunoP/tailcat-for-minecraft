plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.146'
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

version = '0.3.1'
group = 'com.tailscale.tailcat.minecraft'

base {
    archivesName = 'tailcat-for-minecraft-neoforge-1.20.1'
}

legacyForge {
    version = '1.20.1-47.3.12'
    validateAccessTransformers = true
}

dependencies {
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

mixin {
    add sourceSets.main, 'mclink.refmap.json'
    config 'mclink.mixins.json'
}

sourceSets {
    main {
        java {
            srcDir file('../mod-common/src/main/java')
        }
        resources {
            srcDir file('../mod-common/src/main/resources')
        }
    }
}

processResources {
    filesMatching('tailcat-build.properties') { expand version: project.version }
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    manifest.attributes(['MixinConfigs': 'mclink.mixins.json'])
}

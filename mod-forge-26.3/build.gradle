plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '0.3.1'
group = 'com.tailscale.tailcat.minecraft'

base {
    archivesName = 'tailcat-for-minecraft-forge-26.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

minecraft {
    runs {
        client {
            workingDir = layout.projectDirectory.dir('run')
            args '--mixin.config=mclink.mixins.json'
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            mods {
                mclink {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.6')
    compileOnly 'org.spongepowered:mixin:0.8.7'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

sourceSets {
    main {
        java {
            srcDir file('../mod-common/src/main/java')
        }
        resources {
            srcDir file('../mod-common/src/main/resources')
        }
    }
}

processResources {
    filesMatching('tailcat-build.properties') { expand version: project.version }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes([
            'MixinConfigs'            : 'mclink.mixins.json',
            'Specification-Title'     : 'mclink',
            'Specification-Vendor'    : 'Tailscale',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Tailscale',
        ])
    }
}
